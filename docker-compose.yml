# Full stack: MongoDB + Node backend + React frontend (nginx).
#
#   docker compose up -d --build
#
#   Game:            http://localhost:8080
#   API health:      http://localhost:4000/api/health
#   MongoDB Compass: mongodb://localhost:27017  (database: racing_game)
#
# Values like JWT_SECRET are read from the root .env file if present.

name: arcade-racer

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017" # exposed so MongoDB Compass can connect
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/racing_game
      CLIENT_ORIGIN: http://localhost:${CLIENT_HOST_PORT:-8080}
      # Set a real secret in .env; the fallback is only for local trials.
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      TICK_RATE: ${TICK_RATE:-30}
    ports:
      - "${SERVER_HOST_PORT:-4000}:4000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_HOST_PORT:-8080}:80"

volumes:
  mongo-data:
